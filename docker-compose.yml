services:
  script:
    build:
      context: .
      tags:
        - bitcoinfuzz:script
      args:
        CXXFLAGS: "-DBITCOIN_CORE -DRUST_BITCOIN"
        FUZZ: script
    env_file: .env
    environment:
      MODULES: ${MODULES:-}
    volumes:
      - ./docker:/app/data

  deserialize_block:
    build:
      context: .
      tags:
        - bitcoinfuzz:deserialize_block
      args:
        CXXFLAGS: "-DBITCOIN_CORE -DRUST_BITCOIN -DBTCD"
        FUZZ: deserialize_block
    env_file: .env
    environment:
      MODULES: ${MODULES:-}
    volumes:
      - ./docker:/app/data

  script_eval:
    build:
      context: .
      tags:
        - bitcoinfuzz:script_eval
      args:
        CXXFLAGS: "-DBITCOIN_CORE -DNBITCOIN -DGOCOIN"
        FUZZ: script_eval
    env_file: .env
    environment:
      MODULES: ${MODULES:-}
    volumes:
      - ./docker:/app/data

  verify_script:
