        CXXFLAGS: "-DBITCOIN_CORE -DBTCD -DGOCOIN -DNBITCOIN"
        FUZZ: verify_script
    env_file: .env
    environment:
      MODULES: ${MODULES:-}
      LIBFUZZ_DETECT_LEAKS: 0
      ASAN_OPTIONS: detect_leaks=0
    volumes:
      - ./docker:/app/data

  descriptor_parse:
